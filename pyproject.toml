[project]
name = "framework-agnostic-guardrails"
version = "0.1.0"
description = "Framework-agnostic Guard() wrapper with open-source guardrails"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openevals>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["guard"]

[dependency-groups]
dev = []

